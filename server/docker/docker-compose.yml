services:
  postgres:
    image: postgres:17-alpine
    container_name: vaultiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - vaultiq-network

  redis:
    image: redis:7-alpine
    container_name: vaultiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - vaultiq-network

networks:
  vaultiq-network:
    driver: bridge
