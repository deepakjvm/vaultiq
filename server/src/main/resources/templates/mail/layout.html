<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="emailCard(content)" style="font-family: Helvetica, Arial, sans-serif; min-width: 320px; max-width: 1000px; margin: 0 auto; overflow: auto; line-height: 2; background-color: #f1f1f1; padding: 20px;">
    <div style="margin: 50px auto; width: 100%; max-width: 600px; padding: 20px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);">
        <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; text-align: center;">
            <a href="https://vaultiq.io" style="text-decoration: none;">
                <img src="https://vaultiq.ioassets/onestoplogo.jpg" alt="VaultIQ" style="height: 50px; margin-bottom: 10px;">
            </a>
            <h1 style="font-size: 1.8em; color: #3f51b5; margin: 10px 0;">VaultIQ</h1>
        </div>
        <div style="padding: 20px;" th:insert="${content}">
            <!-- Email content placeholder -->
        </div>
        <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;" />
        <div style="text-align: center; font-size: 0.9em; color: #888;">
            <p>Need help? Contact our support team:</p>
            <p>Email: <a href="mailto:support@vaultiq.io" style="color: #3f51b5; text-decoration: none;">support@vaultiq.io</a></p>
            <div style="margin-top: 20px;">
                <p style="font-size: 1em; color: #333;">Show your support here ❤️</p>
                <a href="https://github.com/deepakjvm/vaultiq" style="margin: 0 10px; color: #3f51b5; text-decoration: none;">GitHub</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
