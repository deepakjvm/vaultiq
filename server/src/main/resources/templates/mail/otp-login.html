<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:replace="~{mail/layout :: emailCard(~{::#otpLoginContent})}">
    <div id="otpLoginContent">
        <p style="font-size: 1.2em; color: #333;">Hi, <span th:text="${name}">User</span>,</p>
        <p style="font-size: 1em; color: #555;">Account Number: <strong style="color: #3f51b5;" th:text="${accountNumber}">xxx1234</strong></p>
        <p style="font-size: 1em; color: #333;">Thank you for choosing VaultIQ. Use the following OTP to complete your login procedures. The OTP is valid for <span th:text="${expiryMinutes}">10</span> minutes:</p>
        <h2 style="background: #3f51b5; margin: 20px 0; width: max-content; padding: 10px 20px; color: #fff; border-radius: 4px;" th:text="${otp}">123456</h2>
        <p style="font-size: 1em; color: #555;">Regards,<br />The VaultIQ Team</p>
    </div>
</div>
</body>
</html>
